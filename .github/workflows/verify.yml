name: Verify bridge

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test bridge contract
        run: python -m unittest discover -s tests -q
      - name: Build bridge image
        run: docker build --platform linux/amd64 -t ezenciel-bridges:verify .
