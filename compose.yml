services:
  codex-openai-proxy:
    build: .
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      - PORT=8100
      - BRIDGE_API_KEY=${BRIDGE_API_KEY}
      - CODEX_EXEC_TIMEOUT_SECONDS=${CODEX_EXEC_TIMEOUT_SECONDS:-1200}
    volumes:
      - codex_config:/home/app/.codex
    restart: unless-stopped

volumes:
  codex_config:
